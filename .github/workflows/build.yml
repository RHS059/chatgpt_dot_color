name: Firefox extension
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Record package checksum
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - name: Upload unsigned Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-dot-color-firefox-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 90
